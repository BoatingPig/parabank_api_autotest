[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -p no:cacheprovider -m "not concurrency"
markers =
    billpay: /billpay 接口用例
    transactions: 流水查询接口用例
    transfer: 资金类写接口用例（deposit / withdraw / transfer）
    happy: 正常业务路径
    boundary: 金额与数值边界
    validation: 必填参数与请求体校验
    consistency: 幂等与数据一致性
    contract: 契约与错误响应格式
    concurrency: 并发用例（改数据、必须串行、结果不稳定，默认不跑）
